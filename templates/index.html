<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Exam</title>
<style>
/* Final Result Screen */
#results-panel.final-result-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  max-height: none;
  z-index: 1000;
  background: #1e1e2f;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  padding: 40px;
}

.final-result {
  text-align: center;
  width: 500px;
  padding: 45px;
  background: #2b2b40;
  border-radius: 20px;
}

.final-result h2 {
  font-size: 32px;
  margin-bottom: 25px;
}

.final-score {
  font-size: 60px;
  font-weight: bold;
  margin: 15px 0;
}

.final-percentage {
  font-size: 32px;
  font-weight: bold;
  margin: 15px 0 30px;
}

.final-result p {
  font-size: 18px;
  margin: 12px 0;
}

.final-result h3 {
  margin-top: 30px;
  font-size: 18px;
}
.final-result {
  text-align: center;
  padding: 30px;
}

.final-result h2 {
  font-size: 28px;
  margin-bottom: 20px;
}

.final-score {
  font-size: 48px;
  font-weight: bold;
  margin: 20px 0;
}

.final-result p {
  font-size: 18px;
  margin: 10px 0;
}

.final-result h3 {
  margin-top: 25px;
}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #1e1e2f; color: #eee; height: 100vh; overflow: hidden; }
  #warning-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #b00020; color: white; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; text-align: center; padding: 20px;
  }
  #warning-screen.active { display: flex; }
  #start-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; text-align: center;
  }
  #start-screen button {
    margin-top: 20px; padding: 15px 30px; font-size: 18px; cursor: pointer;
    background: #4caf50; border: none; color: white; border-radius: 5px;
  }
  #exam-container { display: none; height: 100vh; flex-direction: column; }
  #exam-container.active { display: flex; }
  header {
    background: #2b2b40; padding: 10px 20px; display: flex;
    justify-content: space-between; align-items: center;
  }
  #timer {
  font-size: 20px;
  font-weight: bold;
  min-width: 80px;
  text-align: center;
  }
  #question-nav select, #language-select {
    padding: 6px; font-size: 14px; border-radius: 4px; border: none;
  }
  main { flex: 1; display: flex; overflow: hidden; }
  #question-panel {
    width: 40%; padding: 20px; overflow-y: auto; background: #26263a; border-right: 1px solid #444;
  }
  #question-panel h2 { margin-bottom: 10px; }
  #question-panel .difficulty { color: #ffb300; margin-bottom: 15px; font-size: 14px; }
  #editor-panel { width: 60%; display: flex; flex-direction: column; }
  #code-editor {
    flex: 1; width: 100%; background: #1e1e2f; color: #eee; border: none;
    padding: 15px; font-family: 'Courier New', monospace; font-size: 14px; resize: none;
  }
  #controls { padding: 10px 20px; background: #2b2b40; display: flex; gap: 10px; align-items: center; }
  #controls button {
    padding: 10px 20px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px;
    background: #4caf50; color: white;
  }
  #results-panel {
    padding: 15px 20px; background: #1a1a2a; max-height: 200px; overflow-y: auto; font-size: 13px;
  }
  .result-pass { color: #4caf50; }
  .result-fail { color: #f44336; }
  .testcase-box { background: #2b2b40; padding: 8px; margin-bottom: 6px; border-radius: 4px; }
</style>
</head>
<body>

<div id="warning-screen">
  <h1>⚠ Fullscreen Exited</h1>
  <p>You must remain in fullscreen mode during the exam.</p>
  <button onclick="enterFullscreen()">Return to Fullscreen</button>
</div>

<div id="start-screen">
  <h1>Coding Exam</h1>
  <p>Click below to begin. The exam will run in fullscreen mode.</p>
  <button onclick="startExam()">Start Exam</button>
</div>

<div id="exam-container">
  <header>
    <div id="timer">30:00</div>
    <div id="score">Score: 0/10</div>
    <div id="question-nav">
      Question:
      <select id="questionSelect" onchange="loadQuestion(this.value)"></select>
    </div>
    <div>
      Language:
      <select id="language-select">
        <option value="python">Python</option>
        <option value="c">C</option>
        <option value="java">Java</option>
      </select>
    </div>
  </header>

  <main>
    <div id="question-panel">
      <h2 id="q-title">Loading...</h2>
      <div class="difficulty" id="q-difficulty"></div>
      <p id="q-description"></p>
    </div>
    <div id="editor-panel">
      <textarea id="code-editor" placeholder="Write your code here..."></textarea>
    </div>
  </main>

  <div id="controls">
    <button onclick="previousQuestion()">⬅ Previous</button>
    <button onclick="submitCode()">Submit</button>
    <button onclick="nextQuestion()">Next ➡</button>
    <button onclick="finishExam()">Finish Exam</button>
    <span id="submit-status"></span>
  </div>

  <div id="results-panel"><em>Results will appear here after you submit.</em></div>
</div>

<script>
let currentQuestionId = Number(localStorage.getItem('currentQuestionId')) || 1;
let savedCode = JSON.parse(localStorage.getItem('examSavedCode')) || {};
let timeLeft = Number(localStorage.getItem('examTimeLeft')) || 30 * 60;
let examStarted = localStorage.getItem('examStarted') === 'true';
let timerInterval = null;
let score = 0;
let questionScores = {};
document.getElementById('code-editor').addEventListener('input', function () {
  if (currentQuestionId) {
    savedCode[currentQuestionId] = this.value;
    localStorage.setItem('examSavedCode', JSON.stringify(savedCode));
  }
});

async function startExam() {
  localStorage.setItem('examStarted', 'true');

  await enterFullscreen();

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('exam-container').classList.add('active');

  startTimer();

  await loadQuestionList();
  await loadQuestion(currentQuestionId);
}
function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }

  timerInterval = setInterval(() => {
    timeLeft--;
    localStorage.setItem('examTimeLeft', timeLeft);
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    document.getElementById('timer').textContent =
      `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert('Time is up!');
      submitCode();
    }
  }, 1000);
}
function finishExam() {
  const confirmFinish = confirm(
    `Are you sure you want to finish the exam?\n\nYour current score is ${score}/10.`
  );

  if (!confirmFinish) {
    return;
  }

  clearInterval(timerInterval);
  const totalQuestions = 10;
const percentage = (score / totalQuestions) * 100;
const passed = score;
const failed = totalQuestions - score;

const resultsPanel = document.getElementById('results-panel');
resultsPanel.classList.add('final-result-screen');

resultsPanel.innerHTML = `
  <div class="final-result">
    <h2>🎉 EXAM COMPLETED</h2>

    <p>Your Score</p>

    <div class="final-score">
      ${score}/10
    </div>

    <div class="final-percentage">
      ${percentage}%
    </div>

    <p>✅ Questions Passed: <strong>${passed}</strong></p>
    <p>❌ Questions Not Passed: <strong>${failed}</strong></p>

    <h3>Thank you for completing the exam!</h3>
    <button onclick="restartExam()">🔄 Restart Exam</button>
  </div>
`;
  

  document.getElementById('code-editor').disabled = true;
  document.getElementById('language-select').disabled = true;
}
function restartExam() {
  location.reload();
}
function enterFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) return el.requestFullscreen();
}

document.addEventListener('fullscreenchange', () => {
  const examActive = document.getElementById('exam-container').classList.contains('active');
  if (!document.fullscreenElement && examActive) {
    document.getElementById('warning-screen').classList.add('active');
  } else {
    document.getElementById('warning-screen').classList.remove('active');
  }
});

async function loadQuestionList() {
  const res = await fetch('/questions');
  const questions = await res.json();
  const select = document.getElementById('questionSelect');
  select.innerHTML = '';
  questions.forEach(q => {
    const opt = document.createElement('option');
    opt.value = q.id;
    opt.textContent = `Q${q.id}: ${q.title}`;
    select.appendChild(opt);
  });
}
function nextQuestion() {
  if (currentQuestionId < 10) {
    loadQuestion(currentQuestionId + 1);
  }
}

function previousQuestion() {
  if (currentQuestionId > 1) {
    loadQuestion(currentQuestionId - 1);
  }
}

async function loadQuestion(id) {
  // Save the current question's code before switching
  if (currentQuestionId) {
    savedCode[currentQuestionId] =
      document.getElementById('code-editor').value;
  }

  currentQuestionId = Number(id);
  localStorage.setItem('currentQuestionId', currentQuestionId);
  const res = await fetch(`/question/${id}`);
  const q = await res.json();

  document.getElementById('q-title').textContent = q.title;
  document.getElementById('q-difficulty').textContent = q.difficulty;
  document.getElementById('q-description').textContent = q.description;

  // Restore previously typed code
  document.getElementById('code-editor').value =
    savedCode[currentQuestionId] || '';

  document.getElementById('results-panel').innerHTML =
    '<em>Results will appear here after you submit.</em>';

  // Keep dropdown synchronized
  document.getElementById('questionSelect').value = currentQuestionId;
}
async function submitCode() {
  const code = document.getElementById('code-editor').value;
  const language = document.getElementById('language-select').value;
  const status = document.getElementById('submit-status');
  const resultsPanel = document.getElementById('results-panel');

  status.textContent = 'Running...';
  resultsPanel.innerHTML = '';

  try {
    const res = await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question_id: currentQuestionId, language, code })
    });
    const data = await res.json();
    status.textContent = '';
    if (!data.error) {
      questionScores[currentQuestionId] = data.all_passed ? 1 : 0;

     score = Object.values(questionScores).reduce(
       (total, marks) => total + marks,
       0
     );
     document.getElementById('score').textContent =
       `Score: ${score}/10`;
    }

    if (data.error) {
      resultsPanel.innerHTML = `<div class="result-fail">Error: ${data.error}</div><pre>${data.details || ''}</pre>`;
      return;
    }

    let html = `<strong>Overall: <span class="${data.all_passed ? 'result-pass' : 'result-fail'}">${data.all_passed ? 'ALL PASSED' : 'FAILED'}</span></strong><br><br>`;
    data.results.forEach((r, i) => {
      html += `<div class="testcase-box">
        Test ${i + 1}: <span class="${r.passed ? 'result-pass' : 'result-fail'}">${r.passed ? 'PASS' : 'FAIL'}</span><br>
        Input: ${r.input}<br>
        Expected: ${r.expected}<br>
        Actual: ${r.actual}<br>
        ${r.stderr ? 'Error: ' + r.stderr : ''}
      </div>`;
    });
    resultsPanel.innerHTML = html;
  } catch (err) {
    status.textContent = '';
    resultsPanel.innerHTML = `<div class="result-fail">Request failed: ${err}</div>`;
  }
}
window.addEventListener('load', async () => {
  if (examStarted) {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('exam-container').classList.add('active');

    await loadQuestionList();
    await loadQuestion(currentQuestionId);

    startTimer();

    if (!document.fullscreenElement) {
      document.getElementById('warning-screen').classList.add('active');
    }
  }
});
</script>

</body>
</html>
